name: CI (314551086)

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: ci-314551086-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript Typecheck
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v5

      - id: setup
        name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - id: install
        name: Install dependencies
        run: npm ci

      - id: typecheck
        name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## TypeScript Typecheck"
            echo ""
            echo "| Step | Status |"
            echo "|------|--------|"
            echo "| Checkout | ${{ steps.checkout.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |"
            echo "| Setup Node.js | ${{ steps.setup.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |"
            echo "| Install dependencies | ${{ steps.install.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |"
            echo "| Run TypeScript typecheck | ${{ steps.typecheck.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  prettier:
    name: Prettier Check
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v5

      - id: setup
        name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - id: install
        name: Install dependencies
        run: npm ci

      - id: prettier
        name: Run Prettier check
        run: npm run format:check

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Prettier Check"
            echo ""
            echo "| Step | Status |"
            echo "|------|--------|"
            echo "| Checkout | ${{ steps.checkout.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |"
            echo "| Setup Node.js | ${{ steps.setup.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |"
            echo "| Install dependencies | ${{ steps.install.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |"
            echo "| Run Prettier check | ${{ steps.prettier.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v5

      - id: setup
        name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - id: install
        name: Install dependencies
        run: npm ci

      - id: run-tests
        name: Run tests with JUnit reporter
        run: |
          mkdir -p reports
          npm test -- --reporter=default --reporter=junit --outputFile.junit=reports/vitest-junit.xml

      - id: publish
        name: Publish test results
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: Vitest Test Results
          path: reports/vitest-junit.xml
          reporter: java-junit
          fail-on-error: true

      - id: artifact
        name: Upload test report artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-report
          path: reports/
          if-no-files-found: error

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Run Tests"
            echo ""
            echo "| Step | Status |"
            echo "|------|--------|"
            echo "| Checkout | ${{ steps.checkout.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |"
            echo "| Setup Node.js | ${{ steps.setup.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |"
            echo "| Install dependencies | ${{ steps.install.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |"
            echo "| Run tests | ${{ steps.run-tests.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |"
            echo "| Publish test results | ${{ steps.publish.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |"
            echo "| Upload test report artifact | ${{ steps.artifact.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
