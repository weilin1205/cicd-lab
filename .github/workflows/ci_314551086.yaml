name: CI (314551086)

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: ci-314551086-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        id: typecheck
        run: npm run typecheck 2>&1 | tee typecheck.log

      - name: Append typecheck summary
        if: always()
        run: |
          {
            echo "### TypeScript Typecheck — ${{ steps.typecheck.outcome == 'success' && '✅ Passed' || '❌ Failed' }}"
            echo ""
            if [ "${{ steps.typecheck.outcome }}" = "success" ]; then
              echo "_No type errors._"
            else
              echo '```'
              cat typecheck.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  prettier:
    name: Prettier Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Prettier check
        id: prettier
        run: npm run format:check 2>&1 | tee prettier.log

      - name: Append prettier summary
        if: always()
        run: |
          {
            echo "### Prettier Check — ${{ steps.prettier.outcome == 'success' && '✅ Passed' || '❌ Failed' }}"
            echo ""
            if [ "${{ steps.prettier.outcome }}" = "success" ]; then
              echo "_All files match Prettier code style._"
            else
              echo '```'
              cat prettier.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with JUnit reporter
        id: test
        run: |
          mkdir -p reports
          npm test -- --reporter=default --reporter=junit --outputFile.junit=reports/vitest-junit.xml 2>&1 | tee test.log

      - name: Append test summary
        if: always()
        run: |
          {
            echo "### Vitest — ${{ steps.test.outcome == 'success' && '✅ Passed' || '❌ Failed' }}"
            echo ""
            if [ -f reports/vitest-junit.xml ]; then
              TESTS=$(grep -oP 'tests="\K[0-9]+' reports/vitest-junit.xml | head -1)
              FAILURES=$(grep -oP 'failures="\K[0-9]+' reports/vitest-junit.xml | head -1)
              echo "| Total | Failures |"
              echo "|------:|---------:|"
              echo "| ${TESTS:-?} | ${FAILURES:-?} |"
              echo ""
            fi
            if [ "${{ steps.test.outcome }}" != "success" ]; then
              echo '<details><summary>Test output</summary>'
              echo ''
              echo '```'
              tail -60 test.log
              echo '```'
              echo '</details>'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish test results
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: Vitest Test Results
          path: reports/vitest-junit.xml
          reporter: java-junit
          fail-on-error: true

      - name: Upload test report artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-report
          path: reports/
          if-no-files-found: error

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [typecheck, prettier, test]
    if: always()
    steps:
      - name: Write overall summary
        run: |
          {
            echo "## CI Pipeline Overview"
            echo ""
            echo "| Job | Status |"
            echo "|-----|--------|"
            echo "| TypeScript Typecheck | ${{ needs.typecheck.result == 'success' && '✅ Passed' || '❌ Failed' }} |"
            echo "| Prettier Check       | ${{ needs.prettier.result == 'success' && '✅ Passed' || '❌ Failed' }} |"
            echo "| Tests                | ${{ needs.test.result == 'success' && '✅ Passed' || '❌ Failed' }} |"
            echo ""
            echo "Commit: \`${{ github.sha }}\`"
            echo "Branch: \`${{ github.ref_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if any job failed
        if: >
          needs.typecheck.result != 'success' ||
          needs.prettier.result != 'success' ||
          needs.test.result != 'success'
        run: exit 1
